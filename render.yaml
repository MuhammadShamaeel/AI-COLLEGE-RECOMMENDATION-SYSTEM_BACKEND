services:
  - type: web
    name: edunova-backend
    runtime: python
    repo: https://github.com/MuhammadShamaeel/AI-COLLEGE-RECOMMENDATION-SYSTEM_BACKEND
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ${RENDER_EXTERNAL_HOSTNAME}
    autoDeploy: true